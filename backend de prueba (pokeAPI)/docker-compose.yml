services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post
      POSTGRES_DB: pokemones
    ports:
      - "5432:5432"
    volumes:
      - ./schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql
      - ./seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
